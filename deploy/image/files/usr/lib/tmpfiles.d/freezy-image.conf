# The arena account's home, and lingering so its container starts at boot with nobody logged in.
d /var/home/cheesy 0700 cheesy cheesy -
f /var/lib/systemd/linger/cheesy 0644 root root -
d /var/lib/freezy-net 0755 root root -
d /var/lib/freezy-net/kea 0755 root root -
d /etc/freezy-net 0755 root root -
d /etc/freezy-net/kea 0755 root root -
