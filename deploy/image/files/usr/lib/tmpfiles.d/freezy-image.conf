# The arena account's home, and lingering so its container starts at boot with nobody logged in.
d /var/home/cheesy 0700 cheesy cheesy -
f /var/lib/systemd/linger/cheesy 0644 root root -
d /var/lib/freezy-net 0755 root root -
d /var/lib/freezy-net/kea 0755 root root -
d /etc/freezy-net 0755 root root -
d /etc/freezy-net/kea 0755 root root -

# The arena's container takes the host's time zone (Timezone=local in its unit), and podman refuses to
# start it when /etc/localtime is missing. An installer sets that link; `bootc install` does not. L makes
# the link only when nothing is there, so a zone chosen by the installer or with timedatectl stays.
L /etc/localtime - - - - ../usr/share/zoneinfo/UTC

# Where the jump machines' disks live (freezy-jump).
d /var/lib/freezy 0755 root root -
d /var/lib/freezy/vm 0711 root root -
