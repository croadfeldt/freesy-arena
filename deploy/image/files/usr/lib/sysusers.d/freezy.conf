# The account the arena's container runs as. The uid is fixed at build (CHEESY_UID in the
# Containerfile; install.sh fills it in here) because the arena's container unit lives in a folder
# named after it, /etc/containers/systemd/users/<uid>, and the kept data partition holds files it owns.
u cheesy @CHEESY_UID@ "Freezy Arena" /var/home/cheesy /bin/bash
