# greenboot arms the rollback of a newly staged image when this unit stops, and nothing stops it at
# shutdown by itself: it is only stopped along with the /boot mount it needs. Where /boot is part of the
# root filesystem (a disk made by `bootc install to-disk`) that mount is never stopped, the rollback was
# never armed, and a bad image stayed. Stop it at every shutdown, as ostree's own finalize step is.
[Unit]
Conflicts=final.target
Before=final.target
