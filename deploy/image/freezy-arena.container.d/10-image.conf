[Unit]
Requires=freezy-arena-image.service
After=freezy-arena-image.service

# The arena's data is kept data (freezy-data). Until that step has finished the arena does not start, so
# a server whose data partition could not be mounted never shows an empty event. It tries again every
# few seconds.
[Service]
ExecStartPre=/usr/bin/test -e /run/freezy-data-ready
