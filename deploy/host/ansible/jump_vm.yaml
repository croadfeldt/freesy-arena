# The settings inside a jump virtual machine: its two addresses and its firewall (see ../NETWORK.md).
# Run it against one machine at a time, saying which of the two it is:
#
#   ansible-playbook -i <machine>, -u root deploy/host/ansible/jump_vm.yaml -e freezy_jump_role=external
#   ansible-playbook -i <machine>, -u root deploy/host/ansible/jump_vm.yaml -e freezy_jump_role=internal
#
# For that machine it sets:
#   - the outside card (nearer the venue): its address, in the firewall's `external` zone, which accepts
#     only ssh and translates the address of everything leaving through it;
#   - the inside card (nearer the field): its address, in the `internal` zone, which accepts ssh and DNS;
#   - forwarding on, so the inside network can get out. Nothing is forwarded inward.
#
# It needs NetworkManager and firewalld on the machine and installs nothing. A setting that is already
# right is not touched, so running it over a working machine does not interrupt the connection it runs
# over.
- name: Configure a jump virtual machine
  hosts: all
  become: true
  gather_facts: false
  vars_files:
    - vars.yaml
  vars:
    freezy_cards:
      - "{{ freezy_jump_roles[freezy_jump_role].outside | combine({'zone': 'external'}) }}"
      - "{{ freezy_jump_roles[freezy_jump_role].inside | combine({'zone': 'internal'}) }}"
    freezy_zones:
      - { zone: external, services: "{{ freezy_jump_outside_services }}", masquerade: true }
      - { zone: internal, services: "{{ freezy_jump_inside_services }}", masquerade: false }
  tasks:
    - name: Check which machine this is was given
      ansible.builtin.assert:
        that: freezy_jump_role | default('') in freezy_jump_roles
        fail_msg: "Pass -e freezy_jump_role=external or -e freezy_jump_role=internal."

    - name: Check the machine has what this needs
      ansible.builtin.shell: |
        for c in nmcli firewall-cmd; do command -v "$c" >/dev/null || echo "$c"; done
        for i in {{ freezy_cards | map(attribute='ifname') | join(' ') }}; do
          ip link show "$i" >/dev/null 2>&1 || echo "interface $i"
        done
        firewall-cmd --state >/dev/null 2>&1 || echo "firewalld running"
      register: freezy_missing
      changed_when: false
      failed_when: freezy_missing.stdout_lines | length > 0

    - name: List the NetworkManager connections
      ansible.builtin.command: nmcli -g NAME connection show
      register: freezy_connections
      changed_when: false

    # ---- The two cards. ----

    - name: Create the connections that are missing
      ansible.builtin.command: >-
        nmcli connection add type ethernet con-name {{ item.connection }} ifname {{ item.ifname }}
        connection.autoconnect yes connection.zone {{ item.zone }} ipv6.method disabled
        ipv4.method {{ item.method }}
        {% if item.address is defined %}ipv4.addresses {{ item.address }}{% endif %}
        {% if item.gateway is defined %}ipv4.gateway {{ item.gateway }}{% endif %}
        {% if item.dns is defined %}ipv4.dns {{ item.dns }}{% endif %}
      when: item.connection not in freezy_connections.stdout_lines
      loop: "{{ freezy_cards }}"
      loop_control:
        label: "{{ item.connection }}"

    - name: Read the connections that exist
      ansible.builtin.command: >-
        nmcli -g connection.interface-name,connection.zone,ipv4.method,ipv4.addresses,ipv4.gateway,ipv4.dns
        connection show {{ item.connection }}
      register: freezy_card_now
      changed_when: false
      when: item.connection in freezy_connections.stdout_lines
      loop: "{{ freezy_cards }}"
      loop_control:
        label: "{{ item.connection }}"

    # Applied in place (`device reapply`), so the card does not go down.
    - name: Correct the connections that differ
      ansible.builtin.shell: |
        nmcli connection modify {{ item.item.connection }} \
          connection.interface-name {{ item.item.ifname }} connection.zone {{ item.item.zone }} \
          ipv4.method {{ item.item.method }} ipv4.addresses "{{ item.item.address | default('') }}" \
          ipv4.gateway "{{ item.item.gateway | default('') }}" ipv4.dns "{{ item.item.dns | default('') }}" \
          && nmcli device reapply {{ item.item.ifname }}
      when:
        - item.stdout_lines is defined
        - (item.stdout_lines + ['', '', ''])[:6] != wanted
      vars:
        wanted:
          - "{{ item.item.ifname }}"
          - "{{ item.item.zone }}"
          - "{{ item.item.method }}"
          - "{{ item.item.address | default('') }}"
          - "{{ item.item.gateway | default('') }}"
          - "{{ item.item.dns | default('') }}"
      loop: "{{ freezy_card_now.results }}"
      loop_control:
        label: "{{ item.item.connection }}"

    # ---- The firewall. ----

    # Sets each zone to exactly the listed services and address translation setting. Prints "changed"
    # only if it had to alter something.
    - name: Set what each zone accepts
      ansible.builtin.shell: |
        z={{ item.zone }}; changed=
        have=$(firewall-cmd --permanent --zone=$z --list-services | tr ' ' '\n' | sort | tr '\n' ' ')
        want=$(printf '%s\n' {{ item.services | join(' ') }} | sort | tr '\n' ' ')
        if [ "$have" != "$want" ]; then
          for s in $have; do firewall-cmd -q --permanent --zone=$z --remove-service=$s; done
          for s in $want; do firewall-cmd -q --permanent --zone=$z --add-service=$s; done
          changed=1
        fi
        for kind in ports forward-ports rich-rules; do
          [ -z "$(firewall-cmd --permanent --zone=$z --list-$kind)" ] || { echo "zone $z has $kind this playbook does not manage" >&2; exit 1; }
        done
        if firewall-cmd -q --permanent --zone=$z --query-masquerade; then m=true; else m=false; fi
        if [ $m != {{ item.masquerade | string | lower }} ]; then
          firewall-cmd -q --permanent --zone=$z --{{ 'add' if item.masquerade else 'remove' }}-masquerade; changed=1
        fi
        [ -z "$changed" ] || echo changed
      register: freezy_zone
      changed_when: "'changed' in freezy_zone.stdout"
      loop: "{{ freezy_zones }}"
      loop_control:
        label: "{{ item.zone }}"

    - name: Load the firewall changes
      ansible.builtin.command: firewall-cmd --reload
      when: freezy_zone.changed

    - name: Turn forwarding on, now and at every boot
      ansible.builtin.shell: |
        f=/etc/sysctl.d/90-freezy-jump.conf; want='net.ipv4.ip_forward = 1'
        if [ "$(cat $f 2>/dev/null)" != "$want" ]; then echo "$want" > $f; echo changed; fi
        [ "$(sysctl -n net.ipv4.ip_forward)" = 1 ] || { sysctl -q -w net.ipv4.ip_forward=1; echo changed; }
      register: freezy_forward
      changed_when: "'changed' in freezy_forward.stdout"

    # ---- Prove it on the running machine. NetworkManager brings a new connection up, and puts cards
    # back in their zones after a firewall reload, a moment after the command returns; hence the retries. ----

    - name: Check each card is in its zone
      ansible.builtin.command: firewall-cmd --get-zone-of-interface={{ item.ifname }}
      register: freezy_zone_of
      changed_when: false
      failed_when: false
      until: freezy_zone_of.stdout == item.zone
      retries: 20
      delay: 1
      loop: "{{ freezy_cards }}"
      loop_control:
        label: "{{ item.ifname }}"

    - name: Check each fixed address is up
      ansible.builtin.command: ip -4 -o addr show dev {{ item.ifname }}
      register: freezy_addr
      changed_when: false
      until: (' ' ~ item.address ~ ' ') in freezy_addr.stdout
      retries: 20
      delay: 1
      when: item.address is defined
      loop: "{{ freezy_cards }}"
      loop_control:
        label: "{{ item.ifname }}"
