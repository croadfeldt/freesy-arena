---
# Host-specific values for the Freezy Arena team networks. This is the one place to change them.
# On the field server, overrides go in /etc/freezy-net/vars.yaml (same keys); that file wins.

# The one network interface the field server uses. It carries the FMS network and the team VLANs and
# never has an address of its own; host_network.yaml sets that up.
freezy_field_interface: enp1s0

# VLANs the field server carries for others and never takes an address on: the venue's internet, the
# link between the two jump virtual machines, and the admin (FMS) network. See ../NETWORK.md.
freezy_uplink_vlans:
  - { name: venue,   vlan: 999, connection: vlan999 }
  - { name: transit, vlan: 998, connection: vlan998 }
  - { name: admin,   vlan: 100, connection: vlan100 }

# Which jump machines the field server runs (freezy-jump, on a field server installed from the image).
# Change them with `freezy-jump venue-isolation on|off` and `freezy-jump admin-router ...`, which write
# /etc/freezy-net/vars.yaml and apply the change. See ../NETWORK.md, "Which jump machines run".
#
# true runs the external jump machine, between the venue's network and the transit network. It keeps
# the venue's subnets apart from the field's and is the way in to the field server.
freezy_venue_isolation: true
# Who is gateway and DNS for the admin network: internal (the internal jump machine), gateway (a
# hardware router with its WAN port on the transit VLAN), or none (nothing here; a router in bridge mode).
freezy_admin_router: internal
# Memory for each jump machine.
freezy_jump_memory_mib: 1024

# For a jump machine made by hand, outside the image: the machine and the VLAN interface each of its
# network cards attaches to (jump_vms.yaml), in the order
# the cards appear in the machine. Set the real machine name in /etc/freezy-net/vars.yaml.
freezy_jump_vms:
  - { domain: jump-external, interfaces: [vlan998, vlan999] }

# The field server's own address on the transit network: the way in from the jump machine, so that
# reaching the field server never depends on the UniFi gateway. The jump machine hands it out by DHCP
# and always gives the field server the address just below its own, recognising it by this client id.
# It accepts ssh and ping only, is never a route to anywhere, and the field server passes nothing
# through it (freezy-field.nft). Set freezy_transit_enabled to false to leave it out.
freezy_transit_enabled: true
freezy_transit_connection: cheesy_transit
freezy_transit_parent: vlan998
freezy_transit_client_id: freezy-field-server

# The field server's own address lives on a macvlan on top of the admin VLAN. Its gateway and DNS
# server are the UniFi gateway.
freezy_fms_connection: cheesy_macvlan
freezy_fms_parent: vlan100
freezy_fms_prefix_length: 24
freezy_fms_gateway: 10.0.100.1
freezy_fms_dns: [10.0.100.1]

# The account the arena's container runs as. It owns the request directory.
freezy_arena_user: cheesy

# Where deploy/freezy-update gets a new arena image: an image to pull, such as
# quay.io/<namespace>/freezy-arena:latest (.github/workflows/images.yml pushes one on every merge), or
# empty to build it on the field server from the arena account's checkout. That checkout is
# freezy_arena_checkout, or ~<freezy_arena_user>/freesy-arena-2026 if that is empty.
freezy_arena_image_source: ""
freezy_arena_checkout: ""

# Where a field server installed from the image copies the arena's database backups (freezy-backup,
# every five minutes). Empty copies nothing: the backups then exist only beside the database.
# `label:NAME` is a disk whose filesystem is labelled NAME, a USB stick for one. Anything else is an
# rsync destination, such as backup@host:/srv/freezy.
freezy_backup_target: ""

# The six team VLANs, in the arena's station order. `connection` is the NetworkManager connection (and
# interface) that carries the VLAN on the field server; the one-time host setup creates them.
freezy_team_vlans:
  - { station: red1,  vlan: 10, connection: vlan10 }
  - { station: red2,  vlan: 20, connection: vlan20 }
  - { station: red3,  vlan: 30, connection: vlan30 }
  - { station: blue1, vlan: 40, connection: vlan40 }
  - { station: blue2, vlan: 50, connection: vlan50 }
  - { station: blue3, vlan: 60, connection: vlan60 }

# Team network layout: 10.TE.AM.0/24, the field server at .4, DHCP for driver stations from .20 to .199
# (the same layout the stock Cisco configuration uses).
freezy_gateway_host: 4
freezy_dhcp_first_host: 20
freezy_dhcp_last_host: 199
# Twelve hours, longer than an event day. A connected driver station then never depends on a renewal
# during a match; if Kea is down, it keeps its address. A laptop asks afresh each time it is plugged in.
freezy_dhcp_lease_seconds: 43200

# The FMS address. The per-match step never changes it; it only refuses to run if it is missing.
freezy_fms_address: 10.0.100.5
# The FMS network. Team VLANs may ping it (access point, switch); nothing else there is reachable.
freezy_fms_network: 10.0.100.0/24

# Kea runs as a container (deploy/host/freezy-kea.container). The per-match step writes its
# configuration here, checks it with the same image, and restarts the service.
freezy_kea_config: /etc/freezy-net/kea/kea-dhcp4.conf
freezy_kea_service: freezy-kea.service
freezy_kea_image: localhost/freezy-kea:latest

# Which jump machine jump_vm.yaml is setting up: external (venue to transit) or internal (transit to
# admin, in the place of a hardware router). A machine built from deploy/jump/Containerfile is told
# its role by the field server.
freezy_jump_role: external
# True on a machine built from deploy/jump/Containerfile, which already holds the scripts and units.
freezy_jump_files_installed: false
# Whether the external jump machine also answers DNS on the transit network. False leaves port 53 to
# something else on the machine.
freezy_transit_dns: false
# The addresses the internal jump machine hands out on the admin network. Keep the range clear of
# the FMS address and of field equipment with fixed addresses.
freezy_admin_dhcp_first: 10.0.100.100
freezy_admin_dhcp_last: 10.0.100.199
freezy_admin_dhcp_lease_time: 12h

# Inside the jump virtual machine (jump_vm.yaml). `outside` is the card on the venue's network,
# `inside` the card on the transit network. The interface names are the ones the machine uses today.
freezy_jump_outside: { ifname: eth1, connection: external }
freezy_jump_inside:  { ifname: eth0, connection: internal }

# Networks the jump machine may use for the transit network, in order of preference. It takes the first
# one that does not overlap the venue's networks, serves it by DHCP, and keeps the last usable address
# for itself. Three private ranges, so one is always clear.
freezy_transit_candidates:
  - 192.168.254.248/29
  - 172.31.254.248/29
  - 100.64.254.248/29
# How long to wait for the venue to hand out an address before settling on a transit network without
# one (the first candidate, or the one already in use). This is what lets the field run with no venue.
freezy_transit_wait_seconds: 120
# Short leases, so the UniFi gateway follows within minutes if the transit network ever has to move.
freezy_transit_lease_time: 5m
freezy_transit_dhcp_restart: [systemctl, restart, freezy-transit-dhcp.service]

# What each side of a jump machine accepts for itself. Everything else addressed to the machine is
# refused. Traffic passing through is only ever allowed from the inside card out to the outside card,
# with its address translated; nothing is forwarded inward.
freezy_jump_outside_services: [ssh]
freezy_jump_inside_services: [ssh, dns, dhcp]
