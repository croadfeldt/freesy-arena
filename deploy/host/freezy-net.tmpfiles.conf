# Spool directories shared between the arena container and the host network helper.
# The arena's user writes requests; only root writes results. Change "cheesy" if the arena runs as
# another user.
d /run/freezy-net          0755 root   root   -
d /run/freezy-net/request  0755 cheesy cheesy -
d /run/freezy-net/result   0755 root   root   -
